version: "3.8"

services:
  backend:
    build: ./backend
    container_name: mailwarm-backend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: mailwarm-frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: mailwarm-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  mongo:
    image: mongo:6
    container_name: mailwarm-mongo
    restart: always
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: